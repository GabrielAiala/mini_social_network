services:
  db:
    image: postgres:16-alpine
    container_name: mini_social_network_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_social_network_development}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mini_social_network_development}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_social_network_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      BUNDLE_WITHOUT: ${BUNDLE_WITHOUT:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mini_social_network_development}
      RAILS_SERVE_STATIC_FILES: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/rails
    command: bash -lc "bundle install && bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0 -p 3000"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
